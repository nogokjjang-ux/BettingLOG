{% extends 'base.html' %}{% block title %}{{ '기록 수정' if bet else '기록 추가' }} · TOTO LOG{% endblock %}{% block content %}<div class="page-head"><div><div class="eyebrow">BET ENTRY</div><h1>{{ '기록 수정' if bet else '새 베팅 기록' }}</h1><p class="muted">경기별로 기록하고 결과가 확정되면 정산 상태를 바꾸세요.</p></div><a class="btn ghost" href="{{ url_for('index') }}">← 목록</a></div><form method="post" class="panel entry-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>경기 날짜 *<input type="date" name="bet_date" value="{{ bet.bet_date.isoformat() if bet else today }}" required></label><label>종목 *<select name="sport" required>{% for s in ['축구','야구','농구','테니스','아이스하키','기타'] %}<option {% if (bet and bet.sport == s) or (not bet and s == '축구') %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><label class="wide">경기명 *<input name="event" maxlength="180" value="{{ bet.event if bet else '' }}" placeholder="예: 팀 A vs 팀 B" required></label><label>리그 / 대회<input name="league" value="{{ bet.league if bet else '' }}" placeholder="예: EPL"></label><label>베팅 유형<input name="market" value="{{ bet.market if bet else '' }}" placeholder="예: 승패, 핸디캡, 언더/오버"></label><label>배당률<input name="odds" type="number" min="0.001" step="0.001" value="{{ bet.odds if bet else '1.900' }}" required></label><label>베팅 금액 (원) *<input name="stake" type="number" min="1" step="1" value="{{ bet.stake if bet else '' }}" placeholder="예: 10000" required></label><label>정산 상태<select name="status">{% for key, label in statuses.items() %}<option value="{{ key }}" {% if (bet and bet.status == key) or (not bet and key == 'pending') %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>실제 환급액 (원)<input name="payout" type="number" min="0" step="1" value="{{ bet.payout if bet else 0 }}"><span class="field-help">미정산·낙첨은 0원, 적중은 실제 받은 금액을 입력하세요.</span></label><label class="wide">메모<textarea name="note" rows="3" maxlength="500" placeholder="선택 입력">{{ bet.note if bet else '' }}</textarea></label></div><div class="form-actions"><a class="btn ghost" href="{{ url_for('index') }}">취소</a><button class="btn primary">저장하기 →</button></div></form>{% endblock %}
